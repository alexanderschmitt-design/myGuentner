document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

text-on-brand:var(--c-text-inverted);\n\n  --action-primary:var(--c-brand-blue);\n  --action-primary-soft:var(--c-background-primary-light);\n  --action-primary-soft-hover:var(--c-background-primary-medium);\n  --focus-ring:var(--c-focus);\n\n  --impact-active:var(--c-impact-green);\n  --tab-underline:var(--c-accent-primary);\n}\n\n/* Base reset — mirrors the global rules at the bottom of the app's tokens.css. */\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0;font-family:var(--font-ui);font-size:var(--font-2xs);line-height:var(--lh-2xs);color:var(--c-text);background:var(--c-bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}\nbody{transition:var(--transition-accent)}\ncode,pre,.mono{font-family:var(--font-mono)}\nh1,h2,h3,h4,h5,h6{font-family:var(--font-headline);font-weight:400}\na{color:var(--c-brand-blue);text-decoration:none}\na:hover{color:color-mix(in srgb,var(--c-brand-blue) 80%,black);text-decoration:underline}\n\n/* Global component classes — copied from myguentner/nuxt/assets/css/components.css.\n   These are the shared primitives used across every myGPC wizard step. */\n\n/* Buttons */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-xs2);padding:var(--space-xs2) var(--space-xs);border-radius:var(--radius-md);border:1px solid transparent;font-family:var(--font-ui);font-size:var(--font-2xs);line-height:var(--lh-2xs);letter-spacing:0.1px;font-weight:500;cursor:pointer;text-decoration:none;transition:background 0.15s,color 0.15s,border-color 0.15s,filter 0.15s;white-space:nowrap}\n.btn:disabled{opacity:0.5;cursor:not-allowed}\n.btn-primary{background:var(--c-brand-blue);color:#fff;border-color:var(--c-brand-blue)}\n.btn-primary:hover:not(:disabled){filter:brightness(1.08)}\n.btn-primary:focus-visible{box-shadow:var(--shadow-focus);outline:none}\n.btn-outline{background:transparent;color:var(--c-brand-blue);border-color:var(--c-brand-blue)}\n.btn-outline:hover:not(:disabled){background:color-mix(in srgb,var(--c-brand-blue) 8%,transparent)}\n.btn-text{background:transparent;color:var(--c-brand-blue);border-color:transparent;padding:var(--space-xs2) var(--space-2)}\n.btn-text:hover:not(:disabled){color:color-mix(in srgb,var(--c-brand-blue) 80%,black)}\n.btn-sm{padding:6px 12px;font-size:var(--font-3xs)}\n\n/* Cards */\n.card{background:var(--c-surface);border:1px solid var(--c-border-card);border-radius:var(--radius-md);padding:var(--space-sm)}\n.card+.card{margin-top:var(--space-sm)}\n.card-title{margin:0 0 var(--space-3);font-family:var(--font-ui);font-size:var(--font-2xs);line-height:var(--lh-2xs);color:var(--c-text-medium);font-weight:500}\n\n/* Fields */\n.field{display:flex;flex-direction:column;gap:4px}\n.field>label,.field-label{font-family:var(--font-ui);font-size:var(--font-3xs);line-height:var(--lh-3xs);color:var(--c-text-light2);letter-spacing:0.1px}\n.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--c-border-input);border-radius:var(--radius-xs);font-family:var(--font-ui);font-size:var(--font-xs);line-height:var(--lh-xs);background:white;color:var(--c-text-value);outline:none;transition:border-color 0.15s,box-shadow 0.15s}\n.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--c-brand-blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-brand-blue) 15%,transparent)}\n.field input:disabled,.field select:disabled,.field input[disabled],.field select[disabled]{background:var(--c-surface-muted);color:var(--c-text-muted);opacity:0.6;border-color:var(--c-border-disabled)}\n.input-with-suffix{position:relative;display:flex;align-items:center}\n.input-with-suffix input,.input-with-suffix select{flex:1;padding-right:44px}\n.input-with-suffix .suffix{position:absolute;right:12px;color:var(--c-text-muted);font-size:0.85rem;pointer-events:none}\ninput[type='checkbox'],input[type='radio']{accent-color:var(--c-brand-blue)}\n\n/* Alerts */\n.alert{padding:12px 16px;border-radius:var(--radius);border-left:3px solid var(--c-warning);background:color-mix(in srgb,var(--c-warning) 10%,white);color:var(--c-text);margin-bottom:12px;font-size:0.9rem}\n.alert-error{border-left-color:var(--c-error);background:color-mix(in srgb,var(--c-error) 8%,white)}\n.alert-info{border-left-color:var(--c-brand-blue);background:color-mix(in srgb,var(--c-brand-blue) 6%,white)}\n\n/* Wizard page layout */\n.wizard-page{max-width:var(--layout-wizard-max);margin:0 auto}\n.sub-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:8px 0}\n.sub-toolbar .spacer{flex:1}\n.sub-toolbar .step-count{font-family:var(--font-mono);color:var(--c-text-muted);font-size:0.9rem}\n.bottom-nav{margin-top:24px;padding-top:16px;border-top:1px solid var(--c-border);display:flex;justify-content:space-between;align-items:center}\n\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#e9eaec;font-family:var(--font-ui);padding:40px 40px 80px}\nh1{font-size:24px;font-weight:800;color:var(--c-text-value);margin:0 0 6px}\n.intro{font-size:13px;color:var(--c-text-light2);margin:0 0 36px;max-width:640px}\n.grp{font-size:16px;font-weight:800;color:var(--c-brand-blue);margin:0 0 14px;padding-top:18px;border-top:1px solid var(--c-border)}\n.grp:first-of-type{border-top:none;padding-top:0}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:8px}\n.card-wrap{display:flex}\n.q-card{padding:18px 16px;border-radius:var(--radius-md);background:color-mix(in srgb, var(--c-brand-blue) 6%, white);border-left:3px solid var(--c-brand-blue);width:100%;box-sizing:border-box}\n.q-tag{display:flex;align-items:center;gap:5px;margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-brand-blue)}\n.q-text{margin:0 0 14px;font-size:14px;font-weight:700;line-height:1.4;color:var(--c-text-value)}\n.opts-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.opts-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}\n.opts-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}\n.opt{border:1.5px solid var(--c-border);border-radius:var(--radius-md);background:white;box-shadow:var(--shadow-sm);cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 6px;gap:8px;position:relative}\n.opt:hover{border-color:var(--c-brand-blue);box-shadow:var(--shadow-md)}\n.opt-label{font-size:12px;font-weight:600;color:var(--c-text-value)}\n.opt-sub{font-size:10.5px;color:var(--c-text-light2);margin-top:-4px}\n.chk{position:absolute;top:6px;right:6px;width:14px;height:14px;border:1.5px solid var(--c-border);border-radius:3px;background:white}\nsvg{display:block}\n<\u002Fstyle>\n<\u002Fhead><body>\n<h1>Chatbot-Konfigurationsfragen — Gesamtübersicht<\u002Fh1>\n<p class=\"intro\">Alle bisher entwickelten, grafisch gestützten Frage-Antwort-Karten für den Günther Guided-Dialog, gruppiert nach Herkunft.<\u002Fp>\n<h2 class=\"grp\">Allgemein<\u002Fh2><div class=\"grid\"><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Konfigurationsfrage<\u002Fspan>\n<p class=\"q-text\">Möchtest du ein Gerät für die kalte oder die warme Seite konfigurieren?<\u002Fp>\n<div class=\"opts-row\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 64 48\" width=\"64\" height=\"48\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M4 38L32 24L60 38\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M4 38h56\" stroke=\"#a8adb2\"><\u002Fpath>\n<rect x=\"16\" y=\"13\" width=\"28\" height=\"14\" rx=\"1.5\"><\u002Frect>\n<circle cx=\"24\" cy=\"20\" r=\"4.5\"><\u002Fcircle>\n<circle cx=\"36\" cy=\"20\" r=\"4.5\"><\u002Fcircle>\n<path d=\"M24 17.5v5M21.5 20h5M36 17.5v5M33.5 20h5\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Kalte Seite<\u002Fspan>\n<span class=\"opt-sub\">Außen, Dachaufstellung<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 64 48\" width=\"64\" height=\"48\" fill=\"none\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"20\" y=\"9\" width=\"26\" height=\"23\" stroke=\"#a8adb2\"><\u002Frect>\n<path d=\"M20 9L6 15M46 9L60 15M20 32L6 41M46 32L60 41\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M6 15h54v26h-54z\" stroke=\"#6b7076\"><\u002Fpath>\n<rect x=\"24\" y=\"17\" width=\"16\" height=\"7\" rx=\"1\" stroke=\"#6b7076\"><\u002Frect>\n<circle cx=\"29\" cy=\"20.5\" r=\"1.8\" stroke=\"#6b7076\"><\u002Fcircle>\n<circle cx=\"35\" cy=\"20.5\" r=\"1.8\" stroke=\"#6b7076\"><\u002Fcircle>\n<\u002Fsvg>\n<span class=\"opt-label\">Warme Seite<\u002Fspan>\n<span class=\"opt-sub\">Innen, Luftkühler im Raum<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 class=\"grp\">Facility &amp; Sizing<\u002Fh2><div class=\"grid\"><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Konfigurationsfrage<\u002Fspan>\n<p class=\"q-text\">Welche Gebäudeart soll versorgt werden?<\u002Fp>\n<div class=\"opts-4\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 48 48\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"14\" y=\"8\" width=\"20\" height=\"34\"><\u002Frect>\n<path d=\"M18 14h4M26 14h4M18 21h4M26 21h4M18 28h4M26 28h4\"><\u002Fpath>\n<path d=\"M8 42h32\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Büro<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 48 48\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"10\" y=\"8\" width=\"28\" height=\"34\"><\u002Frect>\n<path d=\"M15 14h5M28 14h5M15 20h5M28 20h5M15 26h5M28 26h5\"><\u002Fpath>\n<path d=\"M20 34h8v8h-8z\"><\u002Fpath>\n<path d=\"M6 42h36\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Hotel<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 48 48\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"12\" y=\"12\" width=\"24\" height=\"30\"><\u002Frect>\n<path d=\"M24 18v12M18 24h12\"><\u002Fpath>\n<path d=\"M6 42h36\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Klinik / Labor<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 48 48\" width=\"44\" height=\"44\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M10 20l2-8h24l2 8\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M9 20h30v22h-30z\"><\u002Fpath>\n<path d=\"M18 42v-10h12v10\"><\u002Fpath>\n<path d=\"M10 20a4 4 0 0 0 8 0M18 20a4 4 0 0 0 8 0M26 20a4 4 0 0 0 8 0\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Einzelhandel<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Konfigurationsfrage<\u002Fspan>\n<p class=\"q-text\">Welche Kühlleistung wird benötigt?<\u002Fp>\n<div class=\"opts-4\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 44\" width=\"30\" height=\"38\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.8\" strokelinecap=\"round\">\n<path d=\"M8 38v-8\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">&lt; 50 kW<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 44\" width=\"30\" height=\"38\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.8\" strokelinecap=\"round\">\n<path d=\"M8 38v-8M20 38v-18\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">50–200 kW<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 44\" width=\"30\" height=\"38\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.8\" strokelinecap=\"round\">\n<path d=\"M8 38v-8M20 38v-18M32 38v-28\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">200–500 kW<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 44\" width=\"30\" height=\"38\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.8\" strokelinecap=\"round\">\n<path d=\"M8 38v-8M20 38v-18M32 38v-28\"><\u002Fpath>\n<path d=\"M2 6l4-4 4 4\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">&gt; 500 kW<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Konfigurationsfrage<\u002Fspan>\n<p class=\"q-text\">Welches Kältemittel bzw. Medium kommt zum Einsatz?<\u002Fp>\n<div class=\"opts-2\" style=\"grid-template-columns:1fr 1fr 1fr;gap:8px\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 48\" width=\"30\" height=\"38\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"12\" y=\"6\" width=\"16\" height=\"8\" rx=\"1\"><\u002Frect>\n<path d=\"M15 6v-3h10v3\"><\u002Fpath>\n<rect x=\"8\" y=\"14\" width=\"24\" height=\"28\" rx=\"3\"><\u002Frect>\n<path d=\"M8 22h24M8 30h24\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">R134a<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 48\" width=\"30\" height=\"38\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"12\" y=\"6\" width=\"16\" height=\"8\" rx=\"1\"><\u002Frect>\n<path d=\"M15 6v-3h10v3\"><\u002Fpath>\n<rect x=\"8\" y=\"14\" width=\"24\" height=\"28\" rx=\"3\"><\u002Frect>\n<path d=\"M8 22h24M8 30h24\"><\u002Fpath>\n<path d=\"M20 22v8\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">R32<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 48\" width=\"30\" height=\"38\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M20 5c6 8 9 13 9 18a9 9 0 1 1-18 0c0-5 3-10 9-18z\"><\u002Fpath>\n<path d=\"M15 26a5 5 0 0 0 5 5\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Glykol-Sole<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Konfigurationsfrage<\u002Fspan>\n<p class=\"q-text\">Welche Aufstellbedingungen sind vor Ort zu beachten?<\u002Fp>\n<div class=\"opts-2\" style=\"grid-template-columns:1fr 1fr 1fr;gap:8px\">\n<div class=\"opt\">\n<span class=\"chk\"><\u002Fspan>\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"6\" y=\"6\" width=\"28\" height=\"28\"><\u002Frect>\n<path d=\"M6 6l6 6M34 6l-6 6M6 34l6-6M34 34l-6-6\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Platzbedarf<\u002Fspan>\n<span class=\"opt-sub\">begrenzte Fläche<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<span class=\"chk\"><\u002Fspan>\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M6 16v8h6l10 8V8l-10 8z\"><\u002Fpath>\n<path d=\"M28 14a8 8 0 0 1 0 12\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M25 30l10-16\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Lärmschutz<\u002Fspan>\n<span class=\"opt-sub\">Schallgrenzwerte<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<span class=\"chk\"><\u002Fspan>\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"8\" y=\"6\" width=\"24\" height=\"30\" rx=\"1.5\"><\u002Frect>\n<path d=\"M8 6v30\" stroke=\"#a8adb2\"><\u002Fpath>\n<circle cx=\"24\" cy=\"21\" r=\"1.4\" fill=\"#6b7076\" stroke=\"none\"><\u002Fcircle>\n<\u002Fsvg>\n<span class=\"opt-label\">Zugänglichkeit<\u002Fspan>\n<span class=\"opt-sub\">Wartung, Anlieferung<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 class=\"grp\">System-Auslegung<\u002Fh2><div class=\"grid\"><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Konfigurationsfrage<\u002Fspan>\n<p class=\"q-text\">Welches Kühlkonzept soll eingesetzt werden?<\u002Fp>\n<div class=\"opts-2\" style=\"grid-template-columns:1fr 1fr 1fr;gap:8px\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"32\" height=\ 2\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"32\" height=\"32\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M20 6C10 10 8 22 14 30c4 5 12 5 16 0-8-2-12-8-10-16\"><\u002Fpath>\n<path d=\"M14 30c4-8 8-16 16-22\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Natural<\u002Fspan>\n<span class=\"opt-sub\">NH3, CO2, propane<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"12\" y=\"5\" width=\"16\" height=\"8\" rx=\"1\"><\u002Frect>\n<path d=\"M15 5V2h10v3\"><\u002Fpath>\n<rect x=\"8\" y=\"13\" width=\"24\" height=\"24\" rx=\"3\"><\u002Frect>\n<path d=\"M8 21h24M8 29h24\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Synthetic / HFC<\u002Fspan>\n<span class=\"opt-sub\">e.g. R134a, R32<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Configuration question<\u002Fspan>\n<p class=\"q-text\">Are there safety constraints at the site — flammability (A2L/A3) or toxicity (NH3)?<\u002Fp>\n<div class=\"opts-2\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M20 4c6 8 9 13 9 18a9 9 0 1 1-18 0c0-5 3-10 9-18z\"><\u002Fpath>\n<path d=\"M20 20c2 3 2 6-1 8\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Flammability<\u002Fspan>\n<span class=\"opt-sub\">A2L / A3 class<\u002F ant<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Configuration question<\u002Fspan>\n<p class=\"q-text\">What operating temperature is required — e.g. CO2 transcritical at high ambient?<\u002Fp>\n<div class=\"opts-2\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M8 24h24\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M20 24V8\" strokewidth=\"2.2\"><\u002Fpath>\n<path d=\"M14 8l6-6 6 6\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Transcritical<\u002Fspan>\n<span class=\"opt-sub\">high ambient temp.<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M8 16h24\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M20 16v16\" strokewidth=\"2.2\"><\u002Fpath>\n<path d=\"M14 32l6 6 6-6\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Subcritical<\u002Fspan>\n<span class=\"opt-sub\">moderate ambient temp.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Configuration question<\u002Fspan>\n<p class=\"q-text\">Is this a new plant with free refrigerant choice, or a retrofit of an existing plant?<\u002Fp>\n<div class=\"opts-2\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"10\" y=\"10\" width=\"20\" height=\"24\"><\u002Frect>\n<path d=\"M15 16h4M21 16h4M15 22h4M21 22h4\"><\u002Fpath>\n<path d=\"M20 4v6M17 6l3-3 3 3\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">New plant<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M26 8a6 6 0 0 0-8 8L6 28l6 6 12-12a6 6 0 0 0 8-8l-4 4-4-4z\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Retrofit<\u002Fspan>\n<span class=\"opt-sub\">existing plant<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 class=\"grp\">Energy &amp; Process Cooling<\u002Fh2><div class=\"grid\"><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Configuration question<\u002Fspan>\n<p class=\"q-text\">What is the primary purpose of the loop?<\u002Fp>\n<div class=\"opts-4\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<circle cx=\"20\" cy=\"20\" r=\"4\"><\u002Fcircle>\n<path d=\"M20 16c0-6 4-8 4-8M20 24c0 6-4 8-4 8M16 20c-6 0-8-4-8-4M24 20c6 0 8 4 8 4\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Free cooling<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M20 6c5 6 7 10 7 14a7 7 0 1 1-14 0c0-4 2-8 7-14z\"><\u002Fpath>\n<path d=\"M8 32h24\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Heat rejection<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<circle cx=\"20\" cy=\"20\" r=\"5\"><\u002Fcircle>\n<path d=\"M20 8v4M20 28v4M8 20h4M28 20h4M11 11l3 3M26 26l3 3M29 11l-3 3M14 26l-3 3\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Machine tool cooling<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"8\" y=\"10\" width=\"16\" height=\"10\" rx=\"1\"><\u002Frect>\n<path d=\"M11 13h10M11 17h6\" stroke=\"#a8adb2\"><\u002Fpath>\n<rect x=\"28\" y=\"22\" width=\"6\" height=\"10\" rx=\"1.5\"><\u002Frect>\n<\u002Fsvg>\n<span class=\"opt-label\">Renewable energy<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Configuration question<\u002Fspan>\n<p class=\"q-text\">What medium and concentration is used in the loop?<\u002Fp>\n<div class=\"opts-3\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M20 6c5 6 7 10 7 14a7 7 0 1 1-14 0c0-4 2-8 7-14z\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Water<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<path d=\"M14 6c4 5 6 8 6 11a5.5 5.5 0 0 1-11 0c0-3 2-6 5-11z\"><\u002Fpath>\n<path d=\"M27 10c4 5 6 8 6 11a5.5 5.5 0 0 1-11 0c0-3 2-6 5-11z\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Glycol mix<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<circle cx=\"20\" cy=\"20\" r=\"13\"><\u002Fcircle>\n<path d=\"M20 20l7-4\" stroke=\"#a8adb2\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Set concentration<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Configuration question<\u002Fspan>\n<p class=\"q-text\">What supply/return temperature and allowable temperature rise are needed?<\u002Fp>\n<div class=\"opts-2\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 44\" width=\"18\" height=\"34\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"17\" y=\"4\" width=\"6\" height=\"22\" rx=\"3\"><\u002Frect>\n<circle cx=\"20\" cy=\"32\" r=\"6\" fill=\"#eceded\"><\u002Fcircle>\n<path d=\"M20 20v12\" stroke=\"#6b7076\" strokewidth=\"3\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Supply<\u002Fspan>\n<span class=\"opt-sub\">e.g. 12 °C<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 44\" width=\"18\" height=\"34\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"17\" y=\"4\" width=\"6\" height=\"22\" rx=\"3\"><\u002Frect>\n<circle cx=\"20\" cy=\"32\" r=\"6\" fill=\"#9aa0a4\"><\u002Fcircle>\n<path d=\"M20 10v22\" stroke=\"#6b7076\" strokewidth=\"3\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Return<\u002Fspan>\n<span class=\"opt-sub\">e.g. 18 °C, ΔT 6 K<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><div class=\"card-wrap\"><div class=\"q-card\">\n<span class=\"q-tag\"><svg viewBox=\"0 0 16 16\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"1.8\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M8 1v3M8 12v3M1 8h3M12 8h3M3.3 3.3l2.1 2.1M10.6 10.6l2.1 2.1M12.7 3.3l-2.1 2.1M5.4 10.6l-2.1 2.1\"><\u002Fpath><\u002Fsvg>Configuration question<\u002Fspan>\n<p class=\"q-text\">Is free cooling available year-round at the site, or only seasonally?<\u002Fp>\n<div class=\"opts-2\">\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"6\" y=\"8\" width=\"28\" height=\"26\" rx=\"1.5\"><\u002Frect>\n<path d=\"M6 15h28\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M12 4v6M28 4v6\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M11 20h4M17 20h4M23 20h4M11 26h4M17 26h4M23 26h4\"><\u002Fpath>\n<\u002Fsvg>\n<span class=\"opt-label\">Year-round<\u002Fspan>\n<\u002Fdiv>\n<div class=\"opt\">\n<svg viewBox=\"0 0 40 40\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"#6b7076\" strokewidth=\"1.6\" strokelinecap=\"round\" strokelinejoin=\"round\">\n<rect x=\"6\" y=\"8\" width=\"28\" height=\"26\" rx=\"1.5\"><\u002Frect>\n<path d=\"M6 15h28\" stroke=\"#a8adb2\"><\u002Fpath>\n<path d=\"M12 4v6M28 4v6\" stroke
